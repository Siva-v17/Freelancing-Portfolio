<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0B0F;
    --ink-soft:#111319;
    --panel:#15171F;
    --panel-line:#242732;
    --paper:#F4F1EA;
    --paper-dim:#C9C6BE;
    --amber:#FF7A33;
    --amber-dim:#B85423;
    --cyan:#4CE0D2;
    --violet:#8C7CFF;
    --muted:#8A8F98;
    --white:#FDFCFA;

    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;

    --container:1240px;
    --radius-s:6px;
    --radius-m:14px;
    --radius-l:28px;

    --ease:cubic-bezier(.16,.84,.44,1);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-body);
    overflow-x:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
  }

  /* background grid + glow */
  .bg-grid{
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(var(--panel-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--panel-line) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:.25;
    mask-image:radial-gradient(circle at center, black 0%, transparent 75%);
    pointer-events:none;
  }

  .glow{
    position:fixed;
    width:900px;
    height:900px;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-55%);
    background:radial-gradient(circle, rgba(255,122,51,.14) 0%, rgba(140,124,255,.08) 40%, transparent 70%);
    pointer-events:none;
    filter:blur(10px);
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    text-align:center;
  }

  .tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--cyan);
    background:rgba(76,224,210,.08);
    border:1px solid rgba(76,224,210,.25);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:32px;
    opacity:0;
    animation:fadeUp .7s var(--ease) forwards;
  }

  .tag::before{
    content:'';
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
  }

  .code{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(88px, 20vw, 168px);
    line-height:.9;
    letter-spacing:-.03em;
    background:linear-gradient(180deg, var(--white) 0%, var(--paper-dim) 55%, var(--amber-dim) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    position:relative;
    opacity:0;
    animation:fadeUp .8s var(--ease) .1s forwards;
  }

  .code span{
    position:relative;
    display:inline-block;
  }

  .code .zero{
    color:var(--amber);
    -webkit-text-fill-color:var(--amber);
    text-shadow:0 0 40px rgba(255,122,51,.45);
  }

  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(22px, 3.4vw, 30px);
    letter-spacing:-.01em;
    color:var(--white);
    margin-top:20px;
    opacity:0;
    animation:fadeUp .7s var(--ease) .22s forwards;
  }

  p.desc{
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.65;
    color:var(--muted);
    max-width:440px;
    margin:14px auto 0;
    opacity:0;
    animation:fadeUp .7s var(--ease) .32s forwards;
  }

  .actions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:40px;
    flex-wrap:wrap;
    opacity:0;
    animation:fadeUp .7s var(--ease) .42s forwards;
  }

  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    letter-spacing:.01em;
    padding:14px 26px;
    border-radius:var(--radius-s);
    border:1px solid transparent;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:9px;
    transition:transform .35s var(--ease), background .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease);
    text-decoration:none;
  }

  .btn svg{
    width:16px;
    height:16px;
    flex-shrink:0;
    transition:transform .35s var(--ease);
  }

  .btn-primary{
    background:var(--amber);
    color:var(--ink);
    box-shadow:0 0 0 rgba(255,122,51,0);
  }

  .btn-primary:hover{
    background:var(--white);
    transform:translateY(-2px);
    box-shadow:0 12px 30px -10px rgba(255,122,51,.55);
  }

  .btn-primary:hover svg{ transform:translateX(-3px); }

  .btn-ghost{
    background:transparent;
    color:var(--paper);
    border-color:var(--panel-line);
  }

  .btn-ghost:hover{
    border-color:var(--cyan);
    color:var(--cyan);
    transform:translateY(-2px);
  }

  .btn-ghost:hover svg{ transform:translateX(3px); }

  .meta{
    margin-top:56px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    opacity:0;
    animation:fadeUp .7s var(--ease) .5s forwards;
  }

  .meta span{ color:var(--violet); }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width:480px){
    .actions{ flex-direction:column; width:100%; }
    .btn{ width:100%; justify-content:center; }
  }
</style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="glow"></div>

  <div class="wrap">
    <span class="tag">Error · Not Found</span>

    <div class="code" aria-hidden="true"><span>4</span><span class="zero">0</span><span>4</span></div>

    <h1>This page took a wrong turn.</h1>
    <p class="desc">
      The page you're looking for doesn't exist, may have been moved, or the link you followed is broken.
    </p>

    <div class="actions">
      <button class="btn btn-ghost" id="goBackBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Go Back
      </button>
      <a class="btn btn-primary" href="index.html">
        Return Home
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
      </a>
    </div>

    <div class="meta">Status <span>404</span> · Resource unavailable</div>
  </div>

  <script>
    document.getElementById('goBackBtn').addEventListener('click', function(){
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>

</body>
</html>
